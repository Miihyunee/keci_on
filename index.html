<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
var TRIP_CONFIG = {
  effectiveDate: "2025.12.18.",
  outer: {
    ilbiPerDay: 25000,
    ilbiVehiclePerDay: 12500,
    mealPerDay: 25000,
    lodgingCap: { "서울": 100000, "광역시": 80000, "기타": 70000 }
  },
  inner: {
    ilbi4hPlus: 20000,
    ilbiUnder4h: 10000,
    vehicleDeduct: 10000
  }
};

function calcTrip(data, cfg) {
  var c = cfg || TRIP_CONFIG;
  var lodgingCap = c.outer.lodgingCap;
  var isInner = data.tripType === '내';

  var sDt = new Date(data.startDate);
  var eDt = new Date(data.endDate);
  var totalDays = 1;
  if (!isNaN(sDt) && !isNaN(eDt)) {
    var diff = eDt.getTime() - sDt.getTime();
    totalDays = Math.max(1, Math.floor(diff / (1000 * 60 * 60 * 24)) + 1);
  }

  var ilbi = 0, meal = 0, lodging = 0;
  var transport = data.transPersonal + data.transCorp;

  if (isInner) {
    var base = (data.innerHours === '4plus') ? c.inner.ilbi4hPlus : c.inner.ilbiUnder4h;
    ilbi = base;
    if (data.innerVehicle) ilbi -= c.inner.vehicleDeduct;
    if (ilbi < 0) ilbi = 0;
  } else {
    if (data.vehicle === 'company') {
      var vDays = Math.min(totalDays, data.vehicleDays);
      var pubDays = Math.max(0, totalDays - vDays);
      ilbi = (c.outer.ilbiVehiclePerDay * vDays) + (c.outer.ilbiPerDay * pubDays);
    } else {
      ilbi = c.outer.ilbiPerDay * totalDays;
    }

    var mealFull = c.outer.mealPerDay * totalDays;
    var mealDeduct = data.freeMeals * Math.floor((c.outer.mealPerDay / 3) / 10) * 10;
    meal = Math.max(0, mealFull - mealDeduct);

    if (data.nights > 0) {
      if (data.grade === '1') {
        lodging = data.lodgingPerNight * data.nights;
      } else {
        var cap = lodgingCap[data.region] || 70000;
        lodging = Math.min(data.lodgingPerNight, cap) * data.nights;
      }
    }
  }

  return { 
    ilbi: ilbi, meal: meal, lodging: lodging, transport: transport, total: ilbi + meal + lodging + transport, totalDays: totalDays
  };
}

var tripList = [];

function toggleTripTypeFields() {
    var type = $('#tripType').val();
    if (type === '내') {
        $('.outer-field').addClass('d-none');
        $('.inner-field').removeClass('d-none');
        $('#vehicleDaysWrapper').hide();
    } else {
        $('.outer-field').removeClass('d-none');
        $('.inner-field').addClass('d-none');
        toggleVehicleFields();
    }
}

function toggleVehicleFields() {
    if ($('#tripType').val() === '외' && $('#vehicle').val() === 'company') {
        $('#vehicleDaysWrapper').show();
    } else {
        $('#vehicleDaysWrapper').hide();
    }
}

function addTrip() {
    var tripType = $('#tripType').val();
    var gradeVal = $('#grade').val();
    var gradeStr = gradeVal === '1' ? '원장급' : (gradeVal === '2' ? '임원급' : '일반직원');

    var data = {
        tripType: tripType,
        grade: gradeVal,
        gradeStr: gradeStr,
        name: $('#name').val().trim(),
        purpose: $('#purpose').val().trim(),
        dest: $('#dest').val().trim(),
        startDate: $('#startDate').val(),
        endDate: $('#endDate').val(),
        vehicle: $('#vehicle').val(),
        vehicleDays: parseInt($('#vehicleDays').val()) || 0,
        nights: parseInt($('#nights').val()) || 0,
        region: $('#region').val(),
        lodgingPerNight: parseInt($('#lodgingPerNight').val()) || 0,
        freeMeals: parseInt($('#freeMeals').val()) || 0,
        innerHours: $('#innerHours').val(),
        innerVehicle: $('#innerVehicle').prop('checked'),
        transPersonal: parseInt($('#transPersonal').val()) || 0,
        transCorp: parseInt($('#transCorp').val()) || 0,
        lodgingPayment: $('#lodgingPayment').val()
    };

    var res = calcTrip(data);
    
    var item = {
        id: Date.now(),
        raw: data,
        calc: res,
        personal: {
            ilbi: res.ilbi,
            meal: res.meal,
            lodging: (data.lodgingPayment === '개인카드') ? res.lodging : 0,
            trans: data.transPersonal
        },
        corp: {
            lodging: (data.lodgingPayment === '법인카드') ? res.lodging : 0,
            trans: data.transCorp
        }
    };

    tripList.push(item);
    renderTable();
    
    // 폼 초기화 (핵심 인적사항 입력 필드만 초기화 후 다음 입력을 유도)
    $('#name').val('');
    $('#purpose').val('');
    $('#dest').val('');
    $('#transPersonal').val(0);
    $('#transCorp').val(0);
    $('#lodgingPerNight').val(0);
    $('#vehicleDays').val(0);
    $('#nights').val(0);
    $('#freeMeals').val(0);
}

function deleteTrip(id) {
    tripList = tripList.filter(function(t) { return t.id !== id; });
    renderTable();
}

function renderTable() {
    var tbody = $('#tripTableBody');
    var tfoot = $('#tripTableFoot');
    tbody.empty();
    tfoot.empty();

    if (tripList.length === 0) {
        tbody.append('<tr><td colspan="14" class="text-muted py-4">등록된 출장 정산 내역이 없습니다.</td></tr>');
        return;
    }

    var sums = { pIlbi:0, pMeal:0, pLodging:0, pTrans:0, cLodging:0, cTrans:0, total:0 };

    tripList.forEach(function(t) {
        var dateDisplay = t.raw.startDate + '<br>~ ' + t.raw.endDate;
        var periodStr = t.raw.tripType === '내' ? (t.raw.innerHours === '4plus' ? '4H이상' : '4H미만') : (t.calc.totalDays + '일' + t.raw.nights + '박');
        var typeStr = t.raw.tripType === '내' ? '근무지내' : '근무지외';
        
        sums.pIlbi += t.personal.ilbi;
        sums.pMeal += t.personal.meal;
        sums.pLodging += t.personal.lodging;
        sums.pTrans += t.personal.trans;
        sums.cLodging += t.corp.lodging;
        sums.cTrans += t.corp.trans;
        sums.total += t.calc.total;

        var tr = '<tr>' +
            '<td class="no-print"><button class="btn btn-outline-danger btn-sm py-0 px-2" onclick="deleteTrip(' + t.id + ')"><i class="ph ph-trash"></i></button></td>' +
            '<td>' + typeStr + '</td>' +
            '<td>' + t.raw.gradeStr + '</td>' +
            '<td>' + t.raw.name + '</td>' +
            '<td style="font-size:11px; line-height:1.2;">' + dateDisplay + '<br>(' + periodStr + ')</td>' +
            '<td>' + t.raw.dest + '</td>' +
            '<td style="text-align:left; max-width:150px; word-break:break-all;">' + t.raw.purpose + '</td>' +
            '<td class="num">' + formatNum(t.personal.ilbi) + '</td>' +
            '<td class="num">' + formatNum(t.personal.meal) + '</td>' +
            '<td class="num">' + formatNum(t.personal.lodging) + '</td>' +
            '<td class="num">' + formatNum(t.personal.trans) + '</td>' +
            '<td class="num">' + formatNum(t.corp.lodging) + '</td>' +
            '<td class="num">' + formatNum(t.corp.trans) + '</td>' +
            '<td class="num font-weight-bold text-success">' + formatNum(t.calc.total) + '</td>' +
            '</tr>';
        tbody.append(tr);
    });

    var footTr = '<tr>' +
        '<td class="no-print">합계</td>' +
        '<td colspan="6" class="print-only-merge">총 정산액 합계</td>' +
        '<td class="num">' + formatNum(sums.pIlbi) + '</td>' +
        '<td class="num">' + formatNum(sums.pMeal) + '</td>' +
        '<td class="num">' + formatNum(sums.pLodging) + '</td>' +
        '<td class="num">' + formatNum(sums.pTrans) + '</td>' +
        '<td class="num">' + formatNum(sums.cLodging) + '</td>' +
        '<td class="num">' + formatNum(sums.cTrans) + '</td>' +
        '<td class="num text-primary font-weight-bold">' + formatNum(sums.total) + '</td>' +
        '</tr>';
    tfoot.append(footTr);
}

function formatNum(num) {
    return num > 0 ? num.toLocaleString('ko-KR') : '-';
}

function exportToExcel() {
    if (tripList.length === 0) {
        alert('저장할 여비 계산 내역이 없습니다.');
        return;
    }
    
    var style = '<style>table { border-collapse:collapse; text-align:center; } th { background:#f1f3f4; border:1px solid #cbd5e1; } td { border:1px solid #cbd5e1; } .num { text-align:right; }</style>';
    var thead = $('#resultTable thead').html();
    thead = thead.replace(/<th rowspan="2" class="no-print" style="width: 50px;">삭제<\/th>/g, '');
    
    var tbody = '';
    var sums = { pIlbi:0, pMeal:0, pLodging:0, pTrans:0, cLodging:0, cTrans:0, total:0 };
    
    tripList.forEach(function(t) {
        var periodStr = t.raw.tripType === '내' ? (t.raw.innerHours === '4plus' ? '4H이상' : '4H미만') : (t.calc.totalDays + '일' + t.raw.nights + '박');
        var typeStr = t.raw.tripType === '내' ? '근무지내' : '근무지외';
        
        sums.pIlbi += t.personal.ilbi; sums.pMeal += t.personal.meal; sums.pLodging += t.personal.lodging;
        sums.pTrans += t.personal.trans; sums.cLogging += t.corp.lodging; sums.cTrans += t.corp.trans; sums.total += t.calc.total;

        tbody += '<tr>' +
            '<td>' + typeStr + '</td><td>' + t.raw.gradeStr + '</td><td>' + t.raw.name + '</td>' +
            '<td>' + t.raw.startDate + ' ~ ' + t.raw.endDate + ' (' + periodStr + ')</td><td>' + t.raw.dest + '</td><td>' + t.raw.purpose + '</td>' +
            '<td class="num">' + t.personal.ilbi + '</td><td class="num">' + t.personal.meal + '</td><td class="num">' + t.personal.lodging + '</td><td class="num">' + t.personal.trans + '</td>' +
            '<td class="num">' + t.corp.lodging + '</td><td class="num">' + t.corp.trans + '</td><td class="num">' + t.calc.total + '</td>' +
            '</tr>';
    });

    tbody += '<tr style="font-weight:bold; background:#f8fafc;">' +
        '<td colspan="6">합계</td>' +
        '<td class="num">' + sums.pIlbi + '</td><td class="num">' + sums.pMeal + '</td><td class="num">' + sums.pLodging + '</td><td class="num">' + sums.pTrans + '</td>' +
        '<td class="num">' + sums.cLogging + '</td><td class="num">' + sums.cTrans + '</td><td class="num">' + sums.total + '</td>' +
        '</tr>';

    var html = '<!DOCTYPE html><html><head><meta charset="utf-8">' + style + '</head><body><table>' + thead + '<tbody>' + tbody + '</tbody></table></body></html>';

    var blob = new Blob([html], { type: 'application/vnd.ms-excel;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '출장여비명세서_' + new Date().toISOString().slice(0,10) + '.xls';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}
</script>
