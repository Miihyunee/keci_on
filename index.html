<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KECI ON - 출장복명 신청</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/timepicker/1.3.5/jquery.timepicker.min.css">

    <link href="./assets/css/custom.css" rel="stylesheet" type="text/css">
</head>
<body>

<div class="page-content">
    <div class="sidebar">
        <div class="sidebar-header">
            <a href="#" class="sidebar-brand">
                <img src="./assets/images/keci_white.png" alt="KECI" class="sidebar-logo-icon">
                <span class="sidebar-logo-text">KECI ON</span>
            </a>
        </div>
        
        <div class="user-profile-box">
            <div class="user-avatar-mock"><i class="ph ph-user"></i></div>
            <div class="profile-name">박미현</div>
            <div class="profile-dept">정보안전팀</div>
        </div>

        <ul class="nav-sidebar">
            <li class="nav-item-header">인사</li>
            <li class="nav-item"><a href="#" class="nav-link"><i class="ph ph-address-book"></i><span>나의 인사정보</span></a></li>
            <li class="nav-item"><a href="#" class="nav-link"><i class="ph ph-users"></i><span>조직도</span></a></li>
            <li class="nav-item-header">근태</li>
            <li class="nav-item"><a href="#" class="nav-link"><i class="ph ph-notebook"></i><span>근태 신청 현황</span></a></li>
            <li class="nav-item active"><a href="#" class="nav-link"><i class="ph ph-note-pencil"></i><span>출장 복명 신청</span></a></li>
        </ul>
    </div>

    <div class="content-wrapper">
        <div class="main-navbar">
            <div class="timer-info">
                <i class="ph ph-clock"></i> <span id="loginTimer">59:59</span>
                <a href="javascript:void(0);" class="btn-timer-extend">연장</a>
            </div>
        </div>

        <div class="content">
            <form id="command" spellcheck="false" action="./add" method="post" autocomplete="off">
                
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title m-0">신청자/승인자 지정</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label-custom">신청자 <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="text" name="memberName" class="form-control member-select-name" value="박미현" readonly>
                                    <input type="hidden" name="memberId" class="form-control member-select-id" value="10797">
                                    <input type="hidden" name="memberDept" class="form-control member-select-dept" value="6614">
                                    <button type="button" class="btn btn-search-custom" onclick="fnOpenModalMemberSingleSelect()"><i class="ph ph-magnifying-glass"></i></button>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label-custom">승인자 <span class="text-danger">*</span></label>
