<!-- [섹션 1] 기본 정보 입력 카드 -->
                <div class="card section-card no-print">
                    <div class="card-header bg-light py-3">
                        <span class="section-title"><i class="ph ph-user-focus text-primary me-2"></i> 1. 출장자 기본 정보</span>
                    </div>
                    <div class="card-body">
                        <!-- 3-3 구조 레이아웃 배치 -->
                        <div class="row g-3">
                            <!-- 첫 번째 줄 (3칸) -->
                            <div class="col-md-4">
                                <label class="form-label font-weight-semibold">출장자 성명</label>
                                <input type="text" id="name" class="form-control" placeholder="홍길동" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label font-weight-semibold">직위 구분</label>
                                <select id="grade" class="form-select">
                                    <option value="1">제1호 (원장, 임원, 2급이상 보직자)</option>
                                    <option value="2" selected>제2호 (제1호 외 임직원)</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label font-weight-semibold">출장 목적지</label>
                                <input type="text" id="dest" class="form-control" placeholder="예: 세종본사, 부산지사" required>
                            </div>
                            
                            <!-- 두 번째 줄 (3칸) - 달력 가로 폭 최대 확보 -->
                            <div class="col-md-4">
                                <label class="form-label font-weight-semibold">출장 용무 (목적)</label>
                                <input type="text" id="purpose" class="form-control" placeholder="예: 정기 검사 및 협의" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label font-weight-semibold">출장 시작일</label>
                                <div class="datepicker-input-wrapper">
                                    <input type="text" id="startDate" class="form-control bootstrap-pretty-datepicker" placeholder="날짜를 선택하세요" autocomplete="off" readonly required>
                                    <i class="ph ph-calendar-blank"></i>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label font-weight-semibold">출장 종료일</label>
                                <div class="datepicker-input-wrapper">
                                    <input type="text" id="endDate" class="form-control bootstrap-pretty-datepicker" placeholder="날짜를 선택하세요" autocomplete="off" readonly required>
                                    <i class="ph ph-calendar-blank"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
